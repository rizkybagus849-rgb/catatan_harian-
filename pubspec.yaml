name: catatan_harian
description: Aplikasi Catatan Harian sederhana dengan shared_preferences dan intl.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3   # menyimpan catatan secara lokal
  intl: ^0.20.2                # format tanggal & jam (bahasa Indonesia)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
